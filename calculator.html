<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple JavaScript Calculator</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 40px;
    }

    h1 {
      font-size: 22px;
    }

    table {
      border-collapse: collapse;
      margin-bottom: 30px;
      min-width: 500px;
    }

    th, td {
      border: 1px solid #333;
      padding: 10px 16px;
      text-align: center;
    }

    th {
      background-color: #f5a623;
      color: #000;
      font-size: 16px;
    }

    /* Shade the operator column in the results table only */
    table.results td:nth-child(2) {
      background-color: #fbe4c0;
    }
  </style>
</head>
<body>
  <h1>Simple JavaScript Calculator</h1>
  <script src="calculator.js"></script>
</body>
</html>
